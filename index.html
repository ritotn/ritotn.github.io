<script>
  // Fill in the real response headers GitHub Pages sends for this page.
  const nav = performance.getEntriesByType("navigation")[0];
  const version = { h2: "HTTP/2", h3: "HTTP/3" }[nav.nextHopProtocol] || "HTTP/1.1";
  const shown = ["date", "server", "x-served-by"];

  fetch(location, { method: "HEAD", cache: "no-store" }).then(res => {
    const lines = shown.map(name => `${name}: ${res.headers.get(name) ?? ""}`);
    const status = `${version} ${res.status} ${res.statusText || "OK"}`;
    document.querySelector(".server").textContent = [status, ...lines].join("\n");
  }).catch(() => {});
</script>
