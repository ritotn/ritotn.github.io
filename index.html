<script>
  // Prepend the real response headers GitHub Pages sends for this page.
  const nav = performance.getEntriesByType("navigation")[0];
  const version = { h2: "HTTP/2", h3: "HTTP/3" }[nav.nextHopProtocol] || "HTTP/1.1";
  const shown = ["date", "server", "content-type", "content-length"];

  fetch(location, { method: "HEAD", cache: "no-store" }).then(res => {
    // content-length: uncompressed size of this file (GitHub's is gzipped)
    const value = name => name === "content-length" ? nav.decodedBodySize : res.headers.get(name);
    const lines = shown.filter(value).map(name => `${name}: ${value(name)}`);
    const response = document.querySelector("pre");
    const status = `${version} ${res.status} ${res.statusText || "OK"}`;
    response.insertAdjacentHTML("afterbegin", `<span class="server">${[status, ...lines].join("\n")}</span>\n`);
  }).catch(() => {});
</script>
